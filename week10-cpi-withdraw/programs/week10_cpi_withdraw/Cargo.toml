[package]
name = "week10_cpi_withdraw"
version = "0.1.0"
description = "Week 10: CPI and Withdraw from Vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "week10_cpi_withdraw"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token"] }
