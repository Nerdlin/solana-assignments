[package]
name = "week12_swap"
version = "0.1.0"
description = "Week 12: Swap via Raydium CLMM"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "week12_swap"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["memo"] }
raydium-clmm-cpi = { git = "https://github.com/raydium-io/raydium-cpi", branch = "anchor-0.31.1", package = "raydium-clmm-cpi", features = ["devnet"] }
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
